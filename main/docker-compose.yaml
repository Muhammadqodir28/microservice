services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8005:8000"
    depends_on:
      main_db:
        condition: service_healthy
    environment:
      APP_KEY: base64:dvVeVdG+F9W/0YDYkzkNmz/KI1Qc4TeOPUvKOXQmLeA=
      DB_HOST: main_db
      DB_PORT: 3306
      DB_DATABASE: main
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    volumes:
      - .:/app
    command: >
      sh -c "php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - shared_net

  main_db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: main
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./storage/dbdata:/var/lib/mysql
    ports:
      - "33064:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shared_net

networks:
  shared_net:
    external: true
    name: pet_shared_network

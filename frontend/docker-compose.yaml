services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped

volumes:
  frontend_node_modules:

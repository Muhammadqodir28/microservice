services:
  frontend:
    image: frontend-frontend
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules_reverb:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-microstore-local-key}
      VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
      VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
      VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    restart: unless-stopped

volumes:
  frontend_node_modules_reverb:

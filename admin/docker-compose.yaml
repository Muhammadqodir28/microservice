services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8004:8000"
    depends_on:
      admin_db:
        condition: service_healthy
    environment:
      APP_KEY: base64:7fmd66rgZraBz+KeNcB/SuLUA7HeUZY+sCJNk1Fhu5U=
      DB_HOST: admin_db
      DB_PORT: 3306
      DB_DATABASE: admin
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    volumes:
      - .:/app
    command: >
      sh -c "php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - shared_net

  admin_db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: admin
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./storage/dbdata:/var/lib/mysql
    ports:
      - "33063:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shared_net

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - shared_net

networks:
  shared_net:
    external: true
    name: pet_shared_network

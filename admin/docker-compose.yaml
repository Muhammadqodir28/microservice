x-admin-environment: &admin-environment
  APP_KEY: base64:7fmd66rgZraBz+KeNcB/SuLUA7HeUZY+sCJNk1Fhu5U=
  DB_HOST: admin_db
  DB_PORT: 3306
  DB_DATABASE: admin
  DB_USERNAME: root
  DB_PASSWORD: root
  QUEUE_CONNECTION: rabbitmq
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:-microstore}
  REVERB_APP_KEY: ${REVERB_APP_KEY:-microstore-local-key}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:-microstore-local-secret}
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:-*}
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8080

services:
  admin:
    image: admin-admin
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8004:8000"
    depends_on:
      admin_db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      reverb:
        condition: service_started
    environment: *admin-environment
    volumes:
      - .:/app
    command: >
      sh -c "php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - shared_net

  queue:
    image: admin-admin
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      admin_db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment: *admin-environment
    volumes:
      - .:/app
    command: php artisan queue:work rabbitmq --queue=product-likes --sleep=1 --tries=3 --timeout=90
    restart: unless-stopped
    networks:
      - shared_net

  reverb:
    image: admin-admin
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      admin_db:
        condition: service_healthy
    environment: *admin-environment
    volumes:
      - .:/app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped
    networks:
      - shared_net

  admin_db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: admin
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./storage/dbdata:/var/lib/mysql
    ports:
      - "33063:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shared_net

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - shared_net

networks:
  shared_net:
    external: true
    name: pet_shared_network
